<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitcoin Markets – Live BTC Price & Charts | BitcoinPulse</title>
  <meta name="description" content="Live Bitcoin price, market cap, trading volume and 7-day chart. Real-time BTC market data." />
  <meta name="coinzilla" content="41156468495a8aa691e04357c1307d62" />
  <link rel="canonical" href="https://bitcoinpulse.co.uk/markets.html" />
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-icon">₿</span><span>BitcoinPulse</span></a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="markets.html">Markets</a>
        <a href="analysis.html">Analysis</a>
        <a href="about.html">About</a>
      </nav>
      <div class="btc-ticker" id="btcTicker">BTC: Loading...</div>
    </div>
  </header>
  <div class="ad-banner ad-top"><div class="container"><div class="ad-placeholder">📢 Advertisement – 728×90</div></div></div>
  <main class="container" style="padding:2rem 1rem;">
    <h1 class="section-title">Bitcoin Market Data</h1>
    <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:1rem; margin-bottom:2rem;">
      <div class="widget"><h3>Price (USD)</h3><div id="mktPriceUSD" class="price-display">--</div></div>
      <div class="widget"><h3>Price (GBP)</h3><div id="mktPriceGBP" class="price-display" style="font-size:1.5rem">--</div></div>
      <div class="widget"><h3>24h Change</h3><div id="mktChange" style="font-size:1.2rem;font-weight:700">--</div></div>
      <div class="widget"><h3>Market Cap</h3><div id="mktCap" style="font-size:1rem;font-weight:600">--</div></div>
      <div class="widget"><h3>24h Volume</h3><div id="mktVol" style="font-size:1rem;font-weight:600">--</div></div>
      <div class="widget"><h3>All-Time High</h3><div id="mktATH" style="font-size:1rem;font-weight:600">--</div></div>
    </div>
    <div class="widget">
      <h3>7-Day Price Chart</h3>
      <canvas id="bigChart" width="800" height="300" style="width:100%;height:auto"></canvas>
    </div>
  </main>
  <footer class="site-footer"><p class="footer-copy">&copy; 2026 BitcoinPulse. All rights reserved.</p></footer>
  <script>
  async function loadMarkets() {
    try {
      const [price, detail, hist] = await Promise.all([
        fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,gbp&include_24hr_change=true&include_market_cap=true&include_24hr_vol=true').then(r=>r.json()),
        fetch('https://api.coingecko.com/api/v3/coins/bitcoin?localization=false&tickers=false&community_data=false&developer_data=false').then(r=>r.json()),
        fetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=7&interval=hourly').then(r=>r.json())
      ]);
      const b = price.bitcoin;
      document.getElementById('mktPriceUSD').textContent = '$' + b.usd.toLocaleString();
      document.getElementById('mktPriceGBP').textContent = '\u00a3' + b.gbp.toLocaleString();
      const ch = b.usd_24h_change; const sign = ch>=0?'+':''; const cls = ch>=0?'price-up':'price-down';
      document.getElementById('mktChange').innerHTML = `<span class="${cls}">${sign}${ch.toFixed(2)}%</span>`;
      document.getElementById('mktCap').textContent = '$' + (b.usd_market_cap/1e9).toFixed(1) + 'B';
      document.getElementById('mktVol').textContent = '$' + (b.usd_24h_vol/1e9).toFixed(2) + 'B';
      const ath = detail?.market_data?.ath?.usd;
      document.getElementById('mktATH').textContent = ath ? '$' + ath.toLocaleString() : '--';
      document.getElementById('btcTicker').textContent = 'BTC: $' + b.usd.toLocaleString();
      const prices = hist.prices.map(p=>p[1]);
      const labels = hist.prices.map(p=>new Date(p[0]).toLocaleDateString('en-GB',{day:'numeric',month:'short'}));
      drawBigChart(prices, labels);
    } catch(e) { console.error(e); }
  }
  function drawBigChart(prices, labels) {
    const canvas = document.getElementById('bigChart');
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const min = Math.min(...prices), max = Math.max(...prices), range = max - min || 1;
    const pad = 40;
    ctx.clearRect(0,0,w,h);
    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'rgba(247,147,26,0.25)'); grad.addColorStop(1,'rgba(247,147,26,0)');
    ctx.beginPath();
    prices.forEach((p,i)=>{
      const x = pad + (i/(prices.length-1))*(w-2*pad);
      const y = pad + (1-(p-min)/range)*(h-2*pad);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.strokeStyle='#f7931a'; ctx.lineWidth=2; ctx.stroke();
    ctx.lineTo(w-pad,h-pad); ctx.lineTo(pad,h-pad); ctx.closePath();
    ctx.fillStyle=grad; ctx.fill();
    ctx.fillStyle='#64748b'; ctx.font='11px Inter';
    const step = Math.floor(prices.length/7);
    for(let i=0;i<prices.length;i+=step||1){
      const x = pad+(i/(prices.length-1))*(w-2*pad);
      ctx.fillText(labels[i],x-15,h-5);
    }
  }
  loadMarkets();
  </script>
</body>
</html>
